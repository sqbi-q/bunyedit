plugins {
	alias(libs.plugins.loom)
	id 'java'
}

def javaVersion = libs.versions.java.get() as Integer

group = project.mod_group
base.archivesName = project.mod_name
version = project.mod_version

import org.gradle.nativeplatform.platform.NativePlatform

def resolveLwjglNatives() {
    def os = System.properties['os.name'].toLowerCase(Locale.ROOT)
    def arch = System.properties['os.arch'].toLowerCase(Locale.ROOT)

    if (os in ["linux", "solaris", "sunos"]) {
        if (arch in ["aarch64", "arm64", "arm-v8"]) {
            return "natives-linux-arm64"
        }
        if (arch in ["arm", "arm-v7", "armv7", "arm32"]) {
            return "natives-linux-arm32"
        }
        else {
            return "natives-linux"
        }
    }
    if (os in ["osx", "mac os x", "darwin"]) {
        def postfix = (arch.contains("aarch64")) ?: "-arm64"
        return "natives-macos${postfix}"
    }
    if (os in ["windows"]) {
        def postfix = (arch.contains("aarch64")) ? "-arm64" : "-x86"
        return "natives-macos${postfix}"
    }
    throw new RuntimeException("Unrecognized or unsupported platform. Please set \"lwjglNatives\" manually")
}

def btaChannel = libs.versions.btaChannel.get()
def btaVersion = ((btaChannel == "nightly") ? "" : "v") + libs.versions.bta.get()

loom {
	noIntermediateMappings()
	customMinecraftManifest.set("https://downloads.betterthanadventure.net/bta-client/${btaChannel}/${btaVersion}/manifest.json")
}

repositories {
	mavenCentral()
	maven { url = "https://jitpack.io" }
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'SignalumMavenInfrastructure'
		url = 'https://maven.thesignalumproject.net/infrastructure'
	}
	maven {
		name = 'SignalumMavenReleases'
		url = 'https://maven.thesignalumproject.net/releases'
	}
    maven {
		name = 'SignalumMavenNightly'
		url = 'https://maven.thesignalumproject.net/nightly'
	}
	ivy {
		url = "https://piston-data.mojang.com"
		patternLayout {
			artifact "v1/[organisation]/[revision]/[module].jar"
			m2compatible = true
		}
		metadataSources { artifact() }
	}
}

configurations {
	embed
}

configurations {
    configureEach {
        exclude group: "org.lwjgl.lwjgl"
    }
}

dependencies {
    minecraft "::${libs.versions.bta}"

    implementation libs.loader
    implementation libs.halplibe

    compileOnly libs.bundles.btaLwjgl
    compileOnly libs.joml
    compileOnly libs.joml.primitives
    compileOnly libs.slf4jApi

	implementation "org.jparsec:jparsec:3.1"
	embed "org.jparsec:jparsec:3.1"

	implementation 'com.google.guava:guava:30.0-jre'
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
	var log4jVersion = "2.20.0"
	implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
	implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
	implementation "org.apache.logging.log4j:log4j-1.2-api:${log4jVersion}"

    runtimeOnly libs.modMenu
    runtimeClasspath libs.clientJar
    def lwjglNatives = resolveLwjglNatives()
    def lwjglVer = libs.versions.lwjgl.get()
    localRuntime(platform("org.lwjgl:lwjgl-bom:${lwjglVer}"))
	localRuntime "org.lwjgl:lwjgl::$lwjglNatives"
	localRuntime "org.lwjgl:lwjgl-glfw::$lwjglNatives"
	localRuntime "org.lwjgl:lwjgl-openal::$lwjglNatives"
	localRuntime "org.lwjgl:lwjgl-opengl::$lwjglNatives"
	localRuntime "org.lwjgl:lwjgl-stb::$lwjglNatives"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
        vendor = JvmVendorSpec.ADOPTIUM
    }
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
	withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
	sourceCompatibility = javaVersion.toString()
	targetCompatibility = javaVersion.toString()
    if (javaVersion > 8) options.release = javaVersion
}

tasks.named("updateDaemonJvm") {
    languageVersion = JavaLanguageVersion.of(libs.versions.gradleJava.get() as Integer)
    vendor = JvmVendorSpec.ADOPTIUM
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}
	from { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } }
}

def resourceMap = [
	version: mod_version,
	fabricloader: libs.versions.loader.get(),
	halplibe: libs.versions.halplibe.get(),
	java: libs.versions.java.get(),
	modmenu: libs.versions.modMenu.get()
]

processResources {
	inputs.properties(resourceMap)

	duplicatesStrategy = 'include'
	with copySpec {
		from("src/main/resources/") {
			include("fabric.mod.json")
			include("*.mixins.json")
			expand(resourceMap)
		}
	};
}
